<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern JS Todo</title>
    <meta
      name="description"
      content="A todo app written in TypeScript with no framework: filters, search, priorities, categories, drag-and-drop ordering and a dark theme."
    />
    <link rel="stylesheet" href="/styles/style.css" />
  </head>

  <body>
    <script>
      // Runs before anything paints, so the page never flashes the light theme
      // at someone who chose dark. `document.body` already exists here, which
      // is why the script sits inside <body> rather than in <head>.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.body.classList.add('dark-theme');
        }
      } catch (e) {}
    </script>
    <div class="container">
      <header>
        <div class="header-top">
          <h1>My Tasks</h1>
          <button
            type="button"
            id="theme-toggle"
            title="Toggle theme"
            aria-label="Toggle dark theme"
            aria-pressed="false"
          >
            <svg
              class="sun-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg
              class="moon-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
        <p id="date-display"></p>
      </header>

      <form id="todo-form">
        <div class="input-group">
          <label class="sr-only" for="todo-input">New task</label>
          <input
            type="text"
            id="todo-input"
            placeholder="What needs to be done?"
            autocomplete="off"
            required
          />
          <label class="sr-only" for="priority-select">Priority</label>
          <select id="priority-select">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <label class="sr-only" for="category-select">Category</label>
          <select id="category-select">
            <option value="general">📁 General</option>
            <option value="work">💼 Work</option>
            <option value="personal">👤 Personal</option>
            <option value="shopping">🛒 Shopping</option>
          </select>
          <button type="submit" id="add-btn">Add</button>
        </div>
      </form>

      <div class="search-container">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
            clip-rule="evenodd"
          />
        </svg>
        <label class="sr-only" for="search-input">Search tasks</label>
        <input type="search" id="search-input" placeholder="Search tasks..." autocomplete="off" />
      </div>

      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">
          All
        </button>
        <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">
          Active
        </button>
        <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">
          Completed
        </button>
      </div>

      <ul id="todo-list" aria-label="Task list"></ul>

      <div id="empty-state" class="empty-state hidden">
        <div class="empty-illustration">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Квадрат чекбокса (массивный) -->
            <rect
              x="40"
              y="40"
              width="120"
              height="120"
              rx="24"
              stroke="var(--primary-color)"
              stroke-width="12"
              fill="none"
              opacity="0.2"
            />

            <!-- Галочка (жирная) -->
            <path
              d="M65 105 L95 135 L165 65"
              stroke="var(--primary-color)"
              stroke-width="16"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />

            <!-- Карандаш (солидный) -->
            <g transform="translate(155 45) rotate(-15)">
              <!-- Тело карандаша -->
              <rect x="0" y="0" width="15" height="80" rx="2" fill="#f59e0b" />
              <!-- Наконечник с грифелем -->
              <path d="M0 80 L7.5 95 L15 80 Z" fill="#FFDAB9" />
              <path d="M5 90 L7.5 95 L10 90 Z" fill="#333" />
              <!-- Стирательная резинка -->
              <rect x="0" y="-10" width="15" height="12" rx="2" fill="#ec4899" />
              <rect x="0" y="0" width="15" height="4" fill="#94a3b8" />
            </g>

            <!-- Тень под карандашом для объема -->
            <circle cx="100" cy="170" r="50" fill="var(--primary-color)" opacity="0.05" />
          </svg>
        </div>
        <h3>All tasks are done!</h3>
        <p>Time to rest and recharge ✨</p>
      </div>

      <div class="stats">
        <span id="items-left" aria-live="polite">0 tasks left</span>
        <button type="button" id="clear-completed">Clear completed</button>
      </div>
    </div>
    <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h3 id="modal-title">Edit task</h3>
        <label class="sr-only" for="modal-input">Task text</label>
        <input type="text" id="modal-input" placeholder="Enter text..." />
        <div class="modal-selects">
          <select id="modal-priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
          <select id="modal-category">
            <option value="general">📁 General</option>
            <option value="work">💼 Work</option>
            <option value="personal">👤 Personal</option>
            <option value="shopping">🛒 Shopping</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" id="modal-cancel">Cancel</button>
          <button type="button" id="modal-save">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
